services:
  postgres:
    image: postgres:16-alpine
    container_name: streamhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamhub_dev
      POSTGRES_PASSWORD: dev_password_change_later
      POSTGRES_DB: streamhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamhub_dev -d streamhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streamhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
